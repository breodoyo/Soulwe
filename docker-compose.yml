services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: soulwe
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: soulwe_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  pgdata:
